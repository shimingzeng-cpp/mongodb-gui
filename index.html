<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
  html, body, #root { margin: 0; padding: 0; overflow: hidden; height: 100%; }
  .shell-tabs.ant-tabs { height: 100%; }
  .shell-tabs .ant-tabs-content-holder { overflow: hidden; flex: 1; }
  .shell-tabs .ant-tabs-content { height: 100%; }
  .shell-tabs .ant-tabs-tabpane { height: 100%; overflow: hidden; }

  /* 自定义滚动条 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* 过渡动画 */
  .fade-in { animation: fadeIn 0.2s ease; }
  .slide-up { animation: slideUp 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 50% { opacity: 0; } }

  /* 表格斑马纹 */
  .zebra-row:nth-child(even) { background: rgba(0,0,0,0.02); }
  .dark .zebra-row:nth-child(even) { background: rgba(255,255,255,0.02); }
</style>
  <title>MongoBuddy</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
