<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>MongoDB GUI Test</title></head>
<body style="font-family: sans-serif; background: #1a1a1a; color: #ddd; padding: 20px;">
<h2>MongoDB GUI 测试</h2>

<div id="status" style="margin-bottom: 10px; padding: 8px; background: #333; border-radius: 4px;"></div>

<button id="connectBtn" onclick="doConnect()" style="padding: 8px 16px; margin: 5px;">连接</button>
<button id="disconnectBtn" onclick="doDisconnect()" style="padding: 8px 16px; margin: 5px;" disabled>断开</button>
<button id="loadDbBtn" onclick="loadDatabases()" style="padding: 8px 16px; margin: 5px;" disabled>加载数据库</button>

<div style="display: flex; gap: 20px; margin-top: 20px;">
  <div style="width: 200px; border: 1px solid #444; border-radius: 4px; padding: 10px;">
    <h4>数据库</h4>
    <div id="dbList"></div>
  </div>
  <div style="width: 200px; border: 1px solid #444; border-radius: 4px; padding: 10px;">
    <h4>集合</h4>
    <div id="colList"></div>
  </div>
  <div style="flex: 1; border: 1px solid #444; border-radius: 4px; padding: 10px; max-height: 400px; overflow: auto;">
    <h4>文档 <span id="docInfo"></span></h4>
    <pre id="docList" style="font-size: 12px;"></pre>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const status = s => { $('status').innerHTML = s; };

  // 检查 window.__mongo
  status('window.__mongo: ' + (window.__mongo ? '✅ 已加载 (' + Object.keys(window.__mongo).join(', ') + ')' : '❌ 未加载'));

  async function doConnect() {
    try {
      await window.__mongo.connect('mongodb://localhost:27017');
      status('✅ 已连接');
      $('connectBtn').disabled = true;
      $('disconnectBtn').disabled = false;
      $('loadDbBtn').disabled = false;
      loadDatabases();
    } catch(e) {
      status('❌ 连接失败: ' + e.message);
    }
  }

  async function doDisconnect() {
    await window.__mongo.disconnect();
    status('已断开');
    $('connectBtn').disabled = false;
    $('disconnectBtn').disabled = true;
    $('loadDbBtn').disabled = true;
    $('dbList').innerHTML = '';
    $('colList').innerHTML = '';
    $('docList').innerHTML = '';
  }

  async function loadDatabases() {
    try {
      const dbs = await window.__mongo.listDatabases();
      $('dbList').innerHTML = dbs.map(db =>
        `<div style="cursor:pointer; padding: 4px 8px; margin: 2px 0; border-radius: 3px;"
              onmouseover="this.style.background='#444'" onmouseout="this.style.background='transparent'"
              onclick="loadCollections('${db.name}')">📁 ${db.name}</div>`
      ).join('');
      status('✅ 已加载 ' + dbs.length + ' 个数据库');
    } catch(e) {
      status('❌ 加载数据库失败: ' + e.message);
    }
  }

  async function loadCollections(dbName) {
    try {
      const cols = await window.__mongo.listCollections(dbName);
      $('colList').innerHTML = cols.map(col =>
        `<div style="cursor:pointer; padding: 4px 8px; margin: 2px 0; border-radius: 3px;"
              onmouseover="this.style.background='#444'" onmouseout="this.style.background='transparent'"
              onclick="loadDocuments('${dbName}', '${col.name}')">📄 ${col.name}</div>`
      ).join('');
      status('✅ 数据库 ' + dbName + ' 有 ' + cols.length + ' 个集合');
    } catch(e) {
      status('❌ 加载集合失败: ' + e.message);
    }
  }

  async function loadDocuments(dbName, colName) {
    try {
      $('docInfo').textContent = `(${dbName}.${colName})`;
      const result = await window.__mongo.findDocuments(dbName, colName, {}, { limit: 50 });
      $('docList').textContent = JSON.stringify(result.docs, null, 2);
      status('✅ 加载了 ' + result.total + ' 条文档');
    } catch(e) {
      status('❌ 加载文档失败: ' + e.message);
    }
  }
</script>
</body>
</html>
